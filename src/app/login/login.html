<input type="text" (input)="handelEvent($event.target.value)" />
 <input type="text" (change)="handelEvent($event.target.value)" />
<select (change)="handelEvent($event.type)">
  <option value="Option 1">Option 1</option>
  <option value="Option 2">Option 2</option>
  <option value="Option 3">Option 3</option>
</select>
<input type="text" (blur)="handelEvent($event.type)" />
<input type="text" (focus)="handelEvent($event.type)" />
<div (mouseleave)="handelEvent($event.type)" class="div1">

</div>
<div (mouseenter)="handelEvent($event.type)" class="div2">
</div>
<hr />
<input type="text" [formControl]="email" placeholder="Enter Email" />
<br />
<br />
<input type="text" [formControl]="password" placeholder="Enter Password" />
<br />
<br />
<button (click)="login()">Login</button>
<button (click)="reset()">Reset</button>
<hr />
<h1>Reactive Forms</h1>
<form [formGroup]="loginForm" (ngSubmit)="handleFormSubmit()">
  <label for="email">Email:</label>
  <input type="email" id="email" formControlName="userEmail" />
  <br />
  <label for="password">Password:</label>
  <input type="password" id="password" formControlName="userPassword" />
  <br />
   <label for="name">Name:</label>
  <input type="text" id="name" formControlName="userName" />
  <br />
  <button type="submit">Submit</button>
</form>
